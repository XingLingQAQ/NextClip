name = "nextclip"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (built client)
[site]
bucket = "../dist/public"

[vars]
SESSION_SECRET = "change-me-in-production"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "nextclip-db"
database_id = "placeholder-replace-after-create"

# Durable Objects for WebSocket rooms
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]
