name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build client
        run: npm run build:client

  build-go-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-server/go.sum

      - name: Build Go server
        working-directory: go-server
        run: |
          go mod download
          CGO_ENABLED=1 go build -o bin/server .

      - name: Run Go tests
        working-directory: go-server
        run: go test ./...

      - name: Vet
        working-directory: go-server
        run: go vet ./...
